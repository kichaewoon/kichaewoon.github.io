short_bio_text_justify: false
short_bio: >-
  <p>
    <b>Research Interests: Agentic AI · LLM Memory & Personalization · Small Language Models</b>
  </p>
  <p>
    I received my B.S. in Computer Science from <a href="https://www.kaist.ac.kr/en/" target="_blank">KAIST</a> in 2026.
    I will be joining the <a href="https://www.mlai-kaist.com/" target="_blank">MLAI Lab</a>
    at <a href="https://gsai.kaist.ac.kr/" target="_blank">KAIST Graduate School of AI</a> as an M.S. student in March 2027,
    advised by Prof. <a href="https://www.sungjuhwang.com/" target="_blank">Sung Ju Hwang</a>.
  </p>
  <p>
    My recent work includes <a href="https://arxiv.org/abs/2607.20482" target="_blank">PersonaTrail</a>, a benchmark and
    memory framework (PacMem) for personalized web agents.
    I am currently working on research agents that plan and carry out long-horizon scientific workflows.
  </p>
  <p>
    More broadly, I want agents to reason reliably when the information they depend on keeps changing across sessions, users,
    and tasks.
    I am also interested in bringing these abilities to small language models through post-training, so that capable agents
    can run where frontier models are too slow or costly.
  </p>
  

